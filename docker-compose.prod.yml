# RETIRED — kept for reference only. This VPS stack never went live;
# production is apps/api-worker + apps/web on Cloudflare Workers.
# See deploy/README.md and deploy/CUTOVER.md.
#
# Single-host production stack (e.g. a Hetzner CPX31 running Docker).
# Everything except Caddy stays on the internal network; Caddy terminates TLS
# for suluhutherapy.co.ke (web), api.suluhutherapy.co.ke (API), and redirects
# suluhutherapy.com to the .co.ke site.
#
#   cp .env.production.example .env.production   # fill in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN_REDIRECT: ${WEB_DOMAIN_REDIRECT}
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    expose:
      - '3000'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      DOCUMENT_STORAGE_DIR: /data/therapist-documents
    volumes:
      - suluhu_documents:/data/therapist-documents
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: `docker compose ... run --rm migrate` after every deploy.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    working_dir: /app/apps/api
    entrypoint: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Africa/Nairobi
    volumes:
      - suluhu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - suluhu_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  suluhu_pgdata:
  suluhu_redisdata:
  suluhu_documents:
  caddy_data:
  caddy_config:
