name: Deploy web (Cloudflare Workers)

# Builds apps/web with OpenNext and deploys it to the `suluhu-web` Worker on
# suluhutherapy.com. Fires after CI succeeds on main, or manually.
# Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers
# Routes:Edit, Zone:DNS:Edit on suluhutherapy.com) and CLOUDFLARE_ACCOUNT_ID.
# Optional repo variable: NEXT_PUBLIC_GOOGLE_CLIENT_ID.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build and deploy
        working-directory: apps/web
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Verify the live site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 https://suluhutherapy.com/)
          if [ "$code" != "200" ]; then
            echo "suluhutherapy.com returned $code, expected 200"
            exit 1
          fi
          echo "Deployed and healthy."
