name: Scratch Neon cleanup (temporary)

# One-off: deletes the throwaway smoke-test accounts created while live
# load-testing the bcryptjs -> PBKDF2 switch (see PR #13), plus the earlier
# ones a parallel Devin session created during initial smoke-testing. Not
# meant to stay in the repo — delete this file once cleanup is confirmed.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Neon branch to clean up
        default: main
        required: true
      apply:
        description: Set to "yes" to actually delete (default only lists/counts)
        default: 'no'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Install postgresql client
        run: sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client

      - name: Count matching rows
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "NEON_API_KEY secret or NEON_PROJECT_ID variable is missing"
            exit 1
          fi
          url=$(npx -y neonctl@8 connection-string "${{ inputs.branch }}" --project-id "$NEON_PROJECT_ID")
          echo "::add-mask::$url"
          echo "$url" > /tmp/db_url
          psql "$(cat /tmp/db_url)" -v ON_ERROR_STOP=1 -c "
            SELECT email, role, created_at FROM users
            WHERE email LIKE 'smoke-pbkdf2-%@example.com'
               OR email IN ('smoke+kp9eqn@example.com', 'smoke-t+kp9eqn@example.com', 'smoke+lpq689@example.com')
            ORDER BY created_at;
          "

      - name: Delete matching rows (only if apply=yes)
        if: ${{ inputs.apply == 'yes' }}
        run: |
          psql "$(cat /tmp/db_url)" -v ON_ERROR_STOP=1 -c "
            DELETE FROM users
            WHERE email LIKE 'smoke-pbkdf2-%@example.com'
               OR email IN ('smoke+kp9eqn@example.com', 'smoke-t+kp9eqn@example.com', 'smoke+lpq689@example.com');
          "

      - name: Confirm nothing left
        if: ${{ inputs.apply == 'yes' }}
        run: |
          psql "$(cat /tmp/db_url)" -v ON_ERROR_STOP=1 -c "
            SELECT count(*) AS remaining FROM users
            WHERE email LIKE 'smoke-pbkdf2-%@example.com'
               OR email IN ('smoke+kp9eqn@example.com', 'smoke-t+kp9eqn@example.com', 'smoke+lpq689@example.com');
          "
