name: Provision API on Cloudflare (manual)

# One-time, idempotent launch of apps/api-worker. Creates (or finds) the R2
# bucket, KV namespace, Queue and Hyperdrive config (over the Neon project
# linked by the Neon GitHub integration), sets any missing Worker secrets, and
# deploys with the real ids substituted in. Prints the non-secret ids at the
# end so they can be committed to apps/api-worker/wrangler.jsonc.
#
# Secrets used: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEON_API_KEY,
# PHI_ENCRYPTION_KEY (create it yourself with `openssl rand -base64 32` and keep
# a copy in a password manager). Variable: NEON_PROJECT_ID. JWT secrets are
# generated here if the Worker doesn't have them yet, and never printed.
on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-api
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      PHI_ENCRYPTION_KEY: ${{ secrets.PHI_ENCRYPTION_KEY }}
      CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        working-directory: .

      - name: Check required secrets
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEON_API_KEY NEON_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "Missing $v"; missing=1; fi
          done
          [ "$missing" = 0 ]
          npx wrangler whoami

      - name: R2 bucket
        run: npx wrangler r2 bucket info suluhu-documents || npx wrangler r2 bucket create suluhu-documents

      - name: Queue
        run: npx wrangler queues info suluhu-reminders || npx wrangler queues create suluhu-reminders

      - name: KV namespace
        run: |
          find_kv() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/storage/kv/namespaces?per_page=100" \
              | jq -r '.result[] | select(.title == "suluhu-api-auth") | .id' | head -1
          }
          id=$(find_kv)
          if [ -z "$id" ]; then npx wrangler kv namespace create suluhu-api-auth; id=$(find_kv); fi
          [ -n "$id" ]
          echo "KV_ID=$id" >> "$GITHUB_ENV"

      - name: Hyperdrive
        run: |
          find_hd() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/hyperdrive/configs" \
              | jq -r '.result[] | select(.name == "suluhu-api-db") | .id' | head -1
          }
          id=$(find_hd)
          if [ -z "$id" ]; then
            url=$(npx -y neonctl@8 connection-string main --project-id "$NEON_PROJECT_ID" --pooled)
            echo "::add-mask::$url"
            npx wrangler hyperdrive create suluhu-api-db --connection-string="$url" > /dev/null
            id=$(find_hd)
          fi
          [ -n "$id" ]
          echo "HYPERDRIVE_ID=$id" >> "$GITHUB_ENV"

      - name: Substitute ids into wrangler.jsonc
        run: |
          sed -i "s/REPLACE_WITH_HYPERDRIVE_CONFIG_ID/$HYPERDRIVE_ID/; s/REPLACE_WITH_KV_NAMESPACE_ID/$KV_ID/" wrangler.jsonc
          if grep -n REPLACE_WITH_ wrangler.jsonc; then exit 1; fi

      - name: Build workspace dependencies
        working-directory: .
        run: npx turbo run build --filter=@suluhu/api-worker^...

      - run: npm run db:generate

      - name: Deploy with any missing secrets
        run: |
          existing=$(npx wrangler secret list --format json 2>/dev/null | jq -r '.[].name' || true)
          has() { echo "$existing" | grep -qx "$1"; }
          umask 077
          secrets=$(mktemp)
          echo '{}' > "$secrets"
          add() { jq --arg k "$1" --arg v "$2" '. + {($k): $v}' "$secrets" > "$secrets.tmp" && mv "$secrets.tmp" "$secrets"; }
          has JWT_ACCESS_SECRET || add JWT_ACCESS_SECRET "$(openssl rand -base64 48)"
          has JWT_REFRESH_SECRET || add JWT_REFRESH_SECRET "$(openssl rand -base64 48)"
          if ! has PHI_ENCRYPTION_KEY; then
            if [ -z "$PHI_ENCRYPTION_KEY" ]; then
              echo "Missing PHI_ENCRYPTION_KEY repo secret (openssl rand -base64 32; save a copy first)"
              exit 1
            fi
            add PHI_ENCRYPTION_KEY "$PHI_ENCRYPTION_KEY"
          fi
          echo "Uploading secrets: $(jq -r 'keys | join(", ")' "$secrets")"
          npx wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"

      - name: Verify the live API
        run: |
          curl -sS --retry 10 --retry-delay 6 --retry-all-errors -o health.json -w '%{http_code}\n' \
            https://api.suluhutherapy.com/api/v1/health | tee code.txt
          cat health.json; echo
          [ "$(cat code.txt)" = "200" ]

      - name: Ids to commit to wrangler.jsonc
        if: always()
        run: |
          echo "HYPERDRIVE_ID=$HYPERDRIVE_ID"
          echo "KV_ID=$KV_ID"
