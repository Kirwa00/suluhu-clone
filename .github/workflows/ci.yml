name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: suluhu
          POSTGRES_PASSWORD: suluhu_dev_password
          POSTGRES_DB: suluhu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suluhu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://suluhu:suluhu_dev_password@localhost:5432/suluhu_test?schema=public
      DIRECT_URL: postgresql://suluhu:suluhu_dev_password@localhost:5432/suluhu_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-32
      PHI_ENCRYPTION_KEY: Y2ktdGVzdC1waGkta2V5LTMyLWJ5dGVzLWxvbmchISE=
      PROVIDER_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # apps/api-worker's wrangler (v4) requires Node >=22; this already
          # matches .nvmrc (bumped for the apps/web Cloudflare deploy).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Generate Workers Prisma client (apps/api-worker)
        run: npm run -w @suluhu/api-worker db:generate

      - name: Generate Workers runtime types (apps/api-worker)
        run: npm run -w @suluhu/api-worker cf:typegen

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations
        run: npm run db:migrate

      # apps/api-worker's Vitest suite runs via the root `npm run test` below
      # (Turborepo picks it up like any other workspace). It needs secrets
      # the same way `wrangler dev` does locally: a `.dev.vars` file, not
      # plain env vars. Same throwaway CI secrets as the NestJS API above,
      # and the same Postgres service (api-worker's Hyperdrive
      # `localConnectionString` in wrangler.jsonc already points at
      # localhost:5432/suluhu_test with these exact credentials).
      - name: Write apps/api-worker test secrets
        run: |
          cat > apps/api-worker/.dev.vars <<'EOF'
          JWT_ACCESS_SECRET=ci-access-secret-ci-access-secret-32
          JWT_REFRESH_SECRET=ci-refresh-secret-ci-refresh-secret-32
          PHI_ENCRYPTION_KEY=Y2ktdGVzdC1waGkta2V5LTMyLWJ5dGVzLWxvbmchISE=
          EOF

      - name: Unit & integration tests
        run: npm run test

      - name: wrangler deploy --dry-run (apps/api-worker)
        working-directory: apps/api-worker
        run: npx wrangler deploy --dry-run

      - name: Build
        run: npm run build

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start API server
        run: |
          nohup npm run -w @suluhu/api start:prod > /tmp/api.log 2>&1 &
          disown

      - name: Wait for API server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4000/api/v1/auth/login \
              -H "Content-Type: application/json" -d '{}' || true)
            if [ "$code" = "400" ]; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat /tmp/api.log
          exit 1

      - name: E2E tests (web)
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
