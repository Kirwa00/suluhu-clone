name: Scratch promote existing user to admin (temporary)

# One-off: promotes an EXISTING user row (matched by email) to ADMIN or
# SUPER_ADMIN, directly in the Neon `users` table. There is no admin-signup
# path in the app itself (registerSchema only allows PATIENT/THERAPIST), and
# this is for the case where the target email already has an account (so the
# separate _scratch-create-admin.yml's INSERT would collide on the unique
# email/phone constraint). Optionally also resets the password (pass a
# PBKDF2 hash, never a plaintext password) and marks mfa_enabled/status.
# Fails loudly if no row matches — never creates a new user. Not meant to
# stay in the repo — delete this file once the promotion is confirmed.
#
# All inputs go through `env:` and are referenced as "$VAR", and every value
# embedded into a -c SQL string is escaped via sql_escape (doubles any ').
# See _scratch-create-admin.yml's history (PRs #18, #19) for why: inline
# ${{ inputs.x }} interpolation into a double-quoted bash string lets `$`
# followed by digits be misread as bash positional-parameter expansion, and
# psql's own -v/:'var' substitution did not reliably apply via -c either.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Neon branch to update
        default: main
        required: true
      email:
        description: Email of the EXISTING account to promote
        required: true
      role:
        description: ADMIN or SUPER_ADMIN
        default: ADMIN
        required: true
      password_hash:
        description: Optional PBKDF2 hash (pbkdf2$iterations$salt$hash) to also reset the password. Leave blank to keep the existing password.
        required: false
        default: ''

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      TARGET_BRANCH: ${{ inputs.branch }}
      TARGET_EMAIL: ${{ inputs.email }}
      TARGET_ROLE: ${{ inputs.role }}
      TARGET_PASSWORD_HASH: ${{ inputs.password_hash }}
    steps:
      - name: Install postgresql client
        run: sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client

      - name: Validate inputs
        run: |
          case "$TARGET_ROLE" in
            ADMIN|SUPER_ADMIN) ;;
            *) echo "role must be ADMIN or SUPER_ADMIN"; exit 1 ;;
          esac
          if [ -n "$TARGET_PASSWORD_HASH" ]; then
            case "$TARGET_PASSWORD_HASH" in
              'pbkdf2$'*) ;;
              *) echo "password_hash must be a pbkdf2\$... hash, not a plaintext password"; exit 1 ;;
            esac
          fi

      - name: Show current row (fail if it doesn't exist)
        run: |
          sql_escape() { printf '%s' "$1" | sed "s/'/''/g"; }
          url=$(npx -y neonctl@8 connection-string "$TARGET_BRANCH" --project-id "$NEON_PROJECT_ID")
          echo "::add-mask::$url"
          echo "$url" > /tmp/db_url
          esc_email=$(sql_escape "$TARGET_EMAIL")
          existing=$(psql "$(cat /tmp/db_url)" -v ON_ERROR_STOP=1 -tA -c "
            SELECT count(*) FROM users WHERE email = '$esc_email';
          ")
          echo "existing=$existing"
          if [ "$existing" != "1" ]; then
            echo "::error::Expected exactly one user with that email, found $existing — not changing anything"
            exit 1
          fi
          echo "--- before ---"
          psql "$(cat /tmp/db_url)" -v ON_ERROR_STOP=1 -c "
            SELECT id, email, phone, role, status, mfa_enabled, created_at FROM users
            WHERE email = '$esc_email';
          "

      - name: Promote to admin
        run: |
          sql_escape() { printf '%s' "$1" | sed "s/'/''/g"; }
          esc_email=$(sql_escape "$TARGET_EMAIL")
          esc_role=$(sql_escape "$TARGET_ROLE")
          if [ -n "$TARGET_PASSWORD_HASH" ]; then
            esc_password_hash=$(sql_escape "$TARGET_PASSWORD_HASH")
            password_set_clause=", password_hash = '$esc_password_hash'"
          else
            password_set_clause=""
          fi
          psql "$(cat /tmp/db_url)" -v ON_ERROR_STOP=1 -c "
            UPDATE users SET
              role = '$esc_role',
              status = 'ACTIVE',
              mfa_enabled = true,
              email_verified_at = COALESCE(email_verified_at, CURRENT_TIMESTAMP),
              updated_at = CURRENT_TIMESTAMP
              $password_set_clause
            WHERE email = '$esc_email'
            RETURNING id, email, role, status, mfa_enabled;
          "
