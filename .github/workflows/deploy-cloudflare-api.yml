name: Deploy API (Cloudflare Workers)

# Deploys apps/api-worker to the `suluhu-api` Worker on api.suluhutherapy.com.
# Fires after CI succeeds on main, or manually.
# Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers
# Routes:Edit, Hyperdrive:Edit, Workers KV Storage:Edit, Workers R2 Storage:Edit,
# Queues:Edit, Zone:DNS:Edit on suluhutherapy.com) and CLOUDFLARE_ACCOUNT_ID.
# RESEND_API_KEY and DAILY_API_KEY/DAILY_DOMAIN are copied from the repo secrets
# of the same names on each deploy (so a dashboard-only secret can never get
# silently wiped by a `wrangler deploy` that doesn't know about it).
# Other runtime secrets (JWT_*, PHI_ENCRYPTION_KEY, ...) live on the Worker itself via
# `wrangler secret put` — never in this repo or workflow.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build workspace dependencies
        run: npx turbo run build --filter=@suluhu/api-worker^...

      - name: Generate Workers Prisma client
        working-directory: apps/api-worker
        run: npm run db:generate

      - name: Set the Resend API key on the Worker
        working-directory: apps/api-worker
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "Missing repo secret RESEND_API_KEY (EMAIL_MODE=live needs it for sign-up and login codes)."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set the Daily.co credentials on the Worker
        working-directory: apps/api-worker
        run: |
          if [ -z "$DAILY_API_KEY" ] || [ -z "$DAILY_DOMAIN" ]; then
            echo "Missing repo secret DAILY_API_KEY and/or DAILY_DOMAIN (VIDEO_MODE=live needs both for consult-room video)."
            exit 1
          fi
          printf '%s' "$DAILY_API_KEY" | npx wrangler secret put DAILY_API_KEY
          printf '%s' "$DAILY_DOMAIN" | npx wrangler secret put DAILY_DOMAIN
        env:
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
          DAILY_DOMAIN: ${{ secrets.DAILY_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        working-directory: apps/api-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the live API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-connrefused \
            https://api.suluhutherapy.com/api/v1/health)
          if [ "$code" != "200" ]; then
            echo "Health check returned $code, expected 200"
            exit 1
          fi
          echo "Deployed and healthy."
