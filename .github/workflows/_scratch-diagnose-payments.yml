name: Scratch diagnose admin payments endpoint (temporary)

# One-off: checks the live /admin/payments/settings endpoint from a real
# network vantage point (this sandbox's own egress is blocked for
# api.suluhutherapy.com), to rule in/out a server-side CORS or routing
# problem independent of anything in the browser (ad blockers, cache, etc).
# Not meant to stay in the repo — delete this file once the question is
# answered.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: CORS preflight for PATCH /admin/payments/settings
        run: |
          echo "--- OPTIONS preflight (as the browser would send it) ---"
          curl -sS -D - -o /dev/null --max-time 15 \
            -X OPTIONS https://api.suluhutherapy.com/api/v1/admin/payments/settings \
            -H 'Origin: https://suluhutherapy.com' \
            -H 'Access-Control-Request-Method: PATCH' \
            -H 'Access-Control-Request-Headers: authorization,content-type'

      - name: Unauthenticated GET (confirms routing + reachability, expect 401)
        run: |
          echo "--- GET without auth (expect 401, not a connection failure) ---"
          curl -sS -D - -o /tmp/body.json --max-time 15 \
            -X GET https://api.suluhutherapy.com/api/v1/admin/payments/settings \
            -H 'Origin: https://suluhutherapy.com'
          echo "--- body ---"
          cat /tmp/body.json; echo

      - name: Unauthenticated PATCH (confirms routing + reachability, expect 401)
        run: |
          echo "--- PATCH without auth (expect 401, not a connection failure) ---"
          curl -sS -D - -o /tmp/body2.json --max-time 15 \
            -X PATCH https://api.suluhutherapy.com/api/v1/admin/payments/settings \
            -H 'Origin: https://suluhutherapy.com' \
            -H 'Content-Type: application/json' \
            -d '{"mpesaMode":"mock"}'
          echo "--- body ---"
          cat /tmp/body2.json; echo
