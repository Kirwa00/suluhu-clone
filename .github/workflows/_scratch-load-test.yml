name: Scratch load test (temporary)

# One-off diagnostic: hits the live production API's register endpoint N
# times in a row and reports the HTTP status of each, to measure whether a
# given deploy clears the Workers Free plan's 10ms CPU-time cap (Cloudflare
# error 1102) under the password-hashing change on this branch. Not meant
# to stay in the repo — delete this file once the question is answered.
on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of sequential register requests to send
        default: '20'
        required: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install wrangler
        run: npm install -g wrangler@4.152.0
      - name: Tail the live Worker and fire a few requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          wrangler tail suluhu-api --format pretty > /tmp/tail.log 2>&1 &
          tail_pid=$!

          echo "Waiting for the tail to actually connect..."
          for _ in $(seq 1 30); do
            if grep -q "Connected to suluhu-api" /tmp/tail.log 2>/dev/null; then
              echo "Connected."
              break
            fi
            sleep 1
          done
          cat /tmp/tail.log

          for n in 1 2 3; do
            email="smoke-pbkdf2-tail-$(date +%s)-$n-$RANDOM@example.com"
            phone="07$(printf '%08d' $((10000000 + RANDOM)))"
            echo "--- request $n ---"
            curl -sS -o /tmp/resp.json -w '%{http_code}\n' --max-time 15 \
              -X POST https://api.suluhutherapy.com/api/v1/auth/register \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://suluhutherapy.com' \
              -d "{\"email\":\"$email\",\"password\":\"Str0ngPassw0rd!\",\"firstName\":\"Smoke\",\"lastName\":\"Test\",\"phone\":\"$phone\",\"role\":\"PATIENT\",\"acceptedTerms\":true}"
            cat /tmp/resp.json; echo
            sleep 3
          done

          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "===== wrangler tail output ====="
          cat /tmp/tail.log
      - name: Test login (compare() path, both real and unknown accounts)
        run: |
          set -u
          echo "--- login with correct password (real hash compare) ---"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 15 \
            -X POST https://api.suluhutherapy.com/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://suluhutherapy.com' \
            -d '{"email":"smoke-pbkdf2-tail-1792843217-1-22765@example.com","password":"Str0ngPassw0rd!"}')
          echo "code=$code"; cat /tmp/resp.json; echo

          echo "--- login with unknown email (DUMMY_PASSWORD_HASH compare path) ---"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 15 \
            -X POST https://api.suluhutherapy.com/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://suluhutherapy.com' \
            -d '{"email":"definitely-does-not-exist-xyz@example.com","password":"whatever123"}')
          echo "code=$code"; cat /tmp/resp.json; echo
      - name: Hammer /api/v1/auth/register
        run: |
          set -u
          pass=0
          fail=0
          for i in $(seq 1 "${{ github.event.inputs.count }}"); do
            email="smoke-pbkdf2-$(date +%s)-$i-$RANDOM@example.com"
            phone="07$(printf '%08d' $((10000000 + RANDOM * 100 + i)))"
            phone="${phone:0:10}"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 15 \
              -X POST https://api.suluhutherapy.com/api/v1/auth/register \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://suluhutherapy.com' \
              -d "{\"email\":\"$email\",\"password\":\"Str0ngPassw0rd!\",\"firstName\":\"Smoke\",\"lastName\":\"Test\",\"phone\":\"$phone\",\"role\":\"PATIENT\",\"acceptedTerms\":true}")
            if [ "$code" = "201" ]; then
              pass=$((pass + 1))
              echo "[$i] 201 OK"
            else
              fail=$((fail + 1))
              echo "[$i] $code FAIL"
              cat /tmp/resp.json; echo
            fi
          done
          echo "-----"
          echo "pass=$pass fail=$fail total=$((pass + fail))"
          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail/$((pass + fail)) requests failed"
          fi
