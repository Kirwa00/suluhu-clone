name: Tail API logs (manual)

# Streams live logs (requests, console output, uncaught exceptions) from the
# `suluhu-api` Worker for a few minutes. Start it, then reproduce the problem.
# The repo is public, so these run logs are public: delete the run when done.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How many minutes to stream (1-30)'
        default: '10'
        required: true

concurrency:
  group: tail-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Stream Worker logs
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a number"; exit 1 ;; esac
          if [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 30 ]; then echo "minutes must be 1-30"; exit 1; fi
          echo "Streaming suluhu-api logs for $MINUTES minute(s) — reproduce now."
          status=0
          timeout "$((MINUTES * 60))" npx --yes wrangler@4.152.0 tail suluhu-api --format pretty || status=$?
          # timeout exits 124 when the window ends normally.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
        env:
          MINUTES: ${{ inputs.minutes }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
